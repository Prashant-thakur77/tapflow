# One-click deploy of the TapFlow indexer on Render.
# In the Render dashboard: New → Blueprint → point at this repo → Apply.
# No secrets required: the indexer is read-only against Somnia Shannon.
services:
  - type: web
    name: tapflow-indexer
    runtime: node
    plan: free
    region: oregon
    rootDir: indexer
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: POLL_MS
        value: "15000"
      - key: BACKFILL
        value: "500"
      - key: AGENT_ADDRESS
        value: "0x679812634968c86fb39D943a0a34DA7755b3F228"
      - key: AGENT_LABEL
        value: TapBot
      - key: APP_URL
        value: https://tapflow-phi.vercel.app
