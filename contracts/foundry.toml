[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
solc = "0.8.30"
evm_version = "cancun"          # Somnia Shannon is Cancun + EIP-7702
optimizer = true
optimizer_runs = 200
via_ir = true                   # deploy script's JSON concat needs the IR pipeline
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@somnia-chain/reactivity-contracts/=node_modules/@somnia-chain/reactivity-contracts/",
]
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
shannon = "https://dream-rpc.somnia.network"
